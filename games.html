:root{font-family:system-ui,'Segoe UI',sans-serif;color:#fff;background:#0b1230}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#273d80,#0b1230 75%);min-height:100vh}main{max-width:760px;margin:auto;padding:20px 14px 45px}h1{text-align:center;font-size:26px}h2{margin:4px 0 15px}.card{background:#192753;border:1px solid #5267a2;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 10px 25px #0004}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#c2cdee}.notice{background:#263e73;padding:12px;border-radius:12px;line-height:1.8}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#ffcf55;color:#162344;font-weight:800;min-height:46px;cursor:pointer}button.secondary{background:#354b7d;color:white}button:disabled{opacity:.5}input,select{width:100%;background:#101d40;border:1px solid #8095cb;color:white;border-radius:12px;padding:12px}label{display:block;margin:8px 0 4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}.tile{aspect-ratio:3/4;border:2px solid #d2a74c;border-radius:12px;background:linear-gradient(135deg,#142144,#2d4075);color:#ffd56b;font-size:clamp(26px,7vw,44px);font-weight:900;box-shadow:inset 0 0 12px #d6a74144;display:grid;place-items:center;padding:2px;overflow:hidden}.tile{overflow-wrap:anywhere;line-height:1.15}.tile.revealed{background:#fff2c7;color:#17264a}.tile.matched{background:#2b8a71;color:#fff;border-color:#6ee2bb}.tile:disabled{opacity:1}.scoreboard{display:grid;grid-template-columns:repeat(var(--players,2),minmax(0,1fr));gap:6px;margin:12px 0}.scoreplayer{border:1px solid #7186b8;border-radius:12px;background:#253968;padding:8px 4px;min-width:0;text-align:center}.scoreplayer.active{border:2px solid #ffcf55;background:#354a7a}.scoreplayer .score-name{font-size:clamp(11px,3vw,15px);overflow-wrap:anywhere}.scoreplayer .score-value{font-size:clamp(16px,4vw,23px);font-weight:9 </style></head><body><main><h1>🏆 تحدي جداول الضرب</h1><div class="notice" style="text-align:center">منصة واحدة لجميع الألعاب والتحديات</div><div id="app"></div><p class="muted small" style="text-align:center">الألعاب الجديدة — نسخة تجريبية مستقلة • <a href="./index.html">العودة إلى التحديات الأساسية</a></p></main>
<script>
'use strict';
const app=document.getElementById('app'),digits='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>digits[+d]),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rand=n=>Math.floor(Math.random()*n);
const levels=[{name:'المبتدئ',pairs:6,max:10},{name:'المتقدم',pairs:9,max:10},{name:'المحترف',pairs:12,max:10},{name:'الأسطوري',pairs:15,max:10}];
let memory=null,rescue=null,timeout=null,turnTimer=null;const gameKey='mc_extra_games_v2';function storeGames(){try{localStorage.setItem(gameKey,JSON.stringify({memory,rescue}))}catch{}}function restoreGames(){try{const v=JSON.parse(localStorage.getItem(gameKey));if(v&&typeof v==='object'){memory=v.memory||null;rescue=v.rescue||null;if(memory&&Array.isArray(memory.cards)&&memory.cards.some(c=>!c.kind))memory=null;if(memory&&memory.busy){for(const i of memory.open||[])if(memory.cards[i]&&!memory.cards[i].matched)memory.cards[i].up=false;memory.open=[];memory.busy=false}}}catch{}}
function clearDelay(){if(turnTimer){clearTimeout(turnTimer);turnTimer=null}if(timeout){clearTimeout(timeout);timeout=null}if(memory&&memory.busy){for(const i of memory.open||[])if(memory.cards[i]&&!memory.cards[i].matched)memory.cards[i].up=false;memory.open=[];memory.busy=false;storeGames()}}
function home(){clearDelay();storeGames();app.innerHTML='<div class="card stack"><h2>اختر اللعبة</h2>'+(memory?'<button class="secondary" onclick="drawMemory()">▶ استكمال تحدي الذاكرة</button>':'')+(rescue?'<button class="secondary" onclick="drawRescue()">▶ استكمال رحلة الإنقاذ</button>':'')+'<a href="./index.html" style="display:block;text-align:center;padding:14px;background:#354b7d;color:white;border-radius:12px;text-decoration:none;font-weight:800">🎯 التحدي الفردي والمنافسة الثنائية</a><button onclick="memorySetup()">🧠 تحدي الذاكرة الذهبية</button><button onclick="rescueSetup()" class="secondary">🌲 رحلة الإنقاذ</button><div class="notice">تجربتان جديدتان لا تؤثران على نتائج التحديات الأساسية.</div></div>'}
function memorySetup(){clearDelay();app.innerHTML='<div class="card stack"><h2>🧠 تحدي الذاكرة الذهبية</h2><div class="notice">اقلب بطاقتين وابحث عن عملية الضرب وناتجها الصحيح. يظهر على ظهر كل بطاقة رقم عربي ذهبي كبير.</div><label>اسم المتسابق الأول</label><input id="m1" maxlength="40" placeholder="الاسم أو اللقب"><label>نوع المنافسة</label><select id="mode" onchange="document.getElementById(\'m2box\').classList.toggle(\'hidden\',this.value===\'single\');document.getElementById(\'m3box\').classList.toggle(\'hidden\',this.value!==\'triple\')"><option value="single">فردي</option><option value="dual">ثنائي على جهاز واحد</option><option value="triple">ثلاثي على جهاز واحد</option></select><div id="m2box" class="hidden"><label>اسم المتسابق الثاني</label><input id="m2" maxlength="40" placeholder="الاسم أو اللقب"><div id="m3box" class="hidden"><label>اسم المتسابق الثالث</label><input id="m3" maxlength="40" placeholder="الاسم أو اللقب"></div></div><label>المستوى</label><select id="ml">'+levels.map((l,i)=>'<option value="'+i+'">'+l.name+' — '+ar(l.pairs)+' أزواج</option>').join('')+'</select><button onclick="startMemory()">ابدأ تحدي الذاكرة</button><button class="secondary" onclick="home()">الرئيسية</button></div>'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function buildMemoryCards(values){const cards=[];for(const v of values){const factors=[];for(let a=1;a<=10;a++)if(v%a===0&&v/a<=10)factors.push([a,v/a]);const [a,b]=factors[rand(factors.length)];cards.push({v,kind:'operation',a,b,up:false,matched:false},{v,kind:'result',up:false,matched:false})}return shuffle(cards)}
function startMemory(){const a=document.getElementById('m1').value.trim(),mode=document.getElementById('mode').value,b=mode!=='single'?document.getElementById('m2').value.trim():'',c=mode==='triple'?document.getElementById('m3').value.trim():'';const names=mode==='single'?[a]:mode==='dual'?[a,b]:[a,b,c];if(names.some(n=>!n)||new Set(names.map(n=>n.normalize('NFKC').replace(/\s+/g,'').toLowerCase())).size!==names.length){alert('أدخل اسمًا مختلفًا لكل متسابق.');return}const level=+document.getElementById('ml').value,l=levels[level],values=new Set();while(values.size<l.pairs)values.add((1+rand(l.max))*(1+rand(10)));const cards=buildMemoryCards(values);memory={names,level,cards,open:[],turn:0,scores:names.map(()=>0),moves:0,busy:false,golden:false,goldenRound:0,turnStarted:Date.now(),turnEnds:Date.now()+15000,roundStarter:0};storeGames();drawMemory()}
function memoryScoreboard(m){return '<div class="scoreboard" style="--players:'+m.names.length+'" role="group" aria-label="نتائج المتسابقين">'+m.names.map((n,i)=>'<div class="scoreplayer '+(m.turn===i?'active':'')+'"><div class="score-name">'+esc(n)+'</div><div class="score-value">'+ar(m.scores[i])+' '+(m.scores[i]===1?'زوج':'أزواج')+'</div>'+(m.turn===i?'<div class="score-turn">● صاحب الدور الآن</div>':'')+'</div>').join('')+'</div>'}
function drawMemory(){if(turnTimer){clearTimeout(turnTimer);turnTimer=null}if(!memory)return;const m=memory,done=m.cards.every(c=>c.matched);if(done){const top=Math.max(...m.scores),leaders=m.scores.map((v,i)=>v===top?i:-1).filter(i=>i>=0);if(m.names.length>1&&leaders.length>1){m.tiePlayers=leaders;storeGames();app.innerHTML='<div class="card stack"><h2>⚖️ تعادل في الصدارة</h2><div class="notice">'+leaders.map(i=>esc(m.names[i])+' — '+ar(m.scores[i])+' أزواج').join(' • ')+'</div><div class="notice">جولة حسم ذهبية من ٥ أزواج بين المتعادلين فقط. تتكرر جولات الحسم إذا استمر التعادل حتى تحديد فائز واحد.</div><button onclick="startMemoryGolden()">بدء الحسم الذهبي</button></div>';return}app.innerHTML='<div class="card stack"><h2>🏆 اكتمل تحدي الذاكرة!</h2>'+m.names.map((n,i)=>'<div class="notice">'+esc(n)+' — '+ar(m.scores[i])+' زوج</div>').join('')+(m.names.length>1?'<h2>'+(m.scores.filter(v=>v===Math.max(...m.scores)).length>1?'تعادل في الصدارة':'الفائز: '+esc(m.names[m.scores.indexOf(Math.max(...m.scores))]))+'</h2>':'')+ '<button onclick="showMemoryCertificate()">عرض شهادة التميز الذهبي</button>'<button onclick="memorySetup()">تحدٍّ جديد</button><button class="secondary" onclick="home()">الرئيسية</button></div>';return}
storeGames();app.innerHTML='<div class="card"><h2>🧠 '+(m.golden?'الحسم الذهبي — الجولة '+ar(m.goldenRound):levels[m.level].name)+'</h2><div class="notice">الدور: '+esc(m.names[m.turn])+' • المتبقي: <span id="turnClock">'+ar(Math.max(0,Math.ceil((m.turnEnds-Date.now())/1000)))+'</span> ثانية • الأزواج المكتشفة: '+ar(m.cards.filter(c=>c.matched).length/2)+' / '+ar(m.cards.length/2)+'</div>'+memoryScoreboard(m)+'<div class="grid">'+m.cards.map((c,i)=>'<button class="tile '+(c.matched?'matched':c.up?'revealed':'')+'" onclick="flip('+i+')" '+(c.matched?'disabled':'')+' aria-label="بطاقة '+ar(i+1)+'">'+(c.up||c.matched?(c.kind==='operation'?ar(c.a)+' × '+ar(c.b):ar(c.v)):ar(i+1))+'</button>').join('')+'</div><div class="notice">الأرقام الذهبية على ظهر البطاقات، وداخل كل زوج عملية ضرب وبطاقة ناتجها الصحيح.</div><div class="row"><button class="secondary" onclick="memorySetup()">إعادة البدء</button><button class="secondary" onclick="home()">الرئيسية</button></div></div>';monitorMemoryTurn()}
function memoryCertificate(m){const max=Math.max(...m.scores),winner=m.names[m.scores.indexOf(max)],score=m.scores[m.scores.indexOf(max)];return '<div id="memory-certificate" class="cert" style="box-sizing:border-box;background:linear-gradient(145deg,#0b1c3d,#203d76 55%,#0a1936);border:9px double #f2c65e;color:#fff;border-radius:28px;text-align:center;padding:45px 18px;min-height:680px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:12px"><div style="font-size:76px;line-height:1;color:#f2c65e">★</div><h2 style="color:#f2c65e;margin:4px 0">شهادة التميز الذهبي</h2><h3 style="color:white;margin:0">تحدي الذاكرة الذهبية</h3><p style="margin:20px 0 0">نمنح بكل فخر وتقدير إلى</p><h2 style="color:#f2c65e;font-size:2.3em;margin:0">'+esc(winner)+'</h2><h3 style="color:#f2c65e;margin:0">وسام التفوق في الذاكرة</h3><p style="line-height:2;margin:0">تقديرًا للتركيز وسرعة التذكر والتميز<br>في مطابقة بطاقات جداول الضرب</p><h3 style="color:#f2c65e;margin:14px 0">الأزواج المكتشفة: '+ar(score)+'</h3><p style="margin:30px 0 0">إدارة تطبيق تحدي جداول الضرب</p><p style="margin:0">تحدي جداول الضرب</p></div>'}
function showMemoryCertificate(){if(!memory)return;app.innerHTML='<div class="card stack"><h2 style="text-align:center">شهادة التميز الذهبي</h2>'+memoryCertificate(memory)+'<button onclick="saveMemoryCertificate()">حفظ شهادة التميز الذهبي</button><button class="secondary" onclick="drawMemory()">العودة إلى النتائج</button><button class="secondary" onclick="home()">الرئيسية</button></div>';window.scrollTo(0,0)}
function saveMemoryCertificate(){const el=document.getElementById('memory-certificate');if(!el)return;const data='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#112c5c"/><rect x="24" y="24" width="1152" height="802" rx="24" fill="none" stroke="#e6ba50" stroke-width="16"/><foreignObject x="90" y="70" width="1020" height="700"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:Arial,sans-serif;text-align:center;color:white;font-size:36px">'+el.innerHTML+'</div></foreignObject></svg>';const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));a.href=url;a.download='شهادة-الذاكرة-الذهبية.svg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function startMemoryGolden(){const m=memory;if(!m||!Array.isArray(m.tiePlayers)||m.tiePlayers.length<2)return;const indices=m.tiePlayers;const nextNames=indices.map(i=>m.names[i]);const prevStarter=indices.indexOf(m.roundStarter);m.names=nextNames;const values=new Set();while(values.size<5)values.add((1+rand(10))*(1+rand(10)));m.cards=buildMemoryCards(values);m.open=[];m.busy=false;m.golden=true;m.goldenRound=(m.goldenRound||0)+1;m.turn=prevStarter>=0?(prevStarter+1)%m.names.length:0;m.roundStarter=m.turn;m.scores=m.names.map(()=>0);m.tiePlayers=null;m.moves=0;m.turnStarted=Date.now();m.turnEnds=Date.now()+15000;storeGames();drawMemory()}
function flip(i){const m=memory;if(!m||Date.now()>m.turnEnds||m.busy||m.cards[i].matched||m.cards[i].up)return;m.cards[i].up=true;m.open.push(i);drawMemory();if(m.open.length===2){m.moves++;const [a,b]=m.open;if(m.cards[a].v===m.cards[b].v&&m.cards[a].kind!==m.cards[b].kind){m.turnEnds=Date.now()+15000;m.cards[a].matched=m.cards[b].matched=true;m.scores[m.turn]++;m.open=[];storeGames();drawMemory()}else{m.busy=true;timeout=setTimeout(()=>{if(memory!==m)return;m.cards[a].up=m.cards[b].up=false;m.open=[];m.busy=false;m.turn=(m.turn+1)%m.names.length;m.turnStarted=Date.now();m.turnEnds=Date.now()+15000;timeout=null;storeGames();drawMemory()},3000)}}}
function monitorMemoryTurn(){if(turnTimer){clearTimeout(turnTimer);turnTimer=null}const m=memory;if(!m||m.cards.every(c=>c.matched))return;const tick=()=>{if(memory!==m)return;const clock=document.getElementById('turnClock');if(!clock)return;const left=Math.max(0,Math.ceil((m.turnEnds-Date.now())/1000));clock.textContent=ar(left);if(left===0){if(m.busy){turnTimer=setTimeout(tick,200);return}m.open.forEach(i=>{if(m.cards[i]&&!m.cards[i].matched)m.cards[i].up=false});m.open=[];m.turn=(m.turn+1)%m.names.length;m.turnEnds=Date.now()+15000;storeGames();drawMemory();return}turnTimer=setTimeout(tick,250)};turnTimer=setTimeout(tick,250)}
function rescueSetup(){clearDelay();app.innerHTML='<div class="card stack"><h2>🌲 رحلة الإنقاذ</h2><div class="notice">طفل ضائع في الغابة. كل إجابة صحيحة تقدمه خطوة نحو والديه، ولا تُلغي الإجابة الخاطئة تقدمه. لكل مستوى صعوبة عشر مراحل؛ تبدأ المرحلة الأولى بست خطوات وتزداد بخطوتين حتى أربع وعشرين خطوة في المرحلة العاشرة. الإجابة الخاطئة تُحسب ضمن عدد الأسئلة، ولا تُنقص عدد الإجابات الصحيحة. تستمر الرحلة حتى يصل، ثم تحصل على شهادة شكر باسمك.</div><label>اسم المنقذ</label><input id="rescuer" maxlength="40" placeholder="اسمك أو لقبك"><label>المنقذ</label><select id="rg"><option value="boy">ذكر</option><option value="girl">أنثى</option></select><label>مستوى صعوبة الأسئلة</label><select id="rd"><option value="0">المستوى الأول — جداول ١ إلى ٥</option><option value="1">المستوى الثاني — جداول ٦ إلى ١٠</option><option value="2">المستوى الثالث — جداول ١ إلى ١٠</option></select><label>مرحلة الإنقاذ</label><select id="rl">'+Array.from({length:10},(_,i)=>'<option value="'+i+'">المرحلة '+ar(i+1)+' — '+ar(6+2*i)+' أسئلة</option>').join('')+'</select><button onclick="startRescue()">ابدأ رحلة الإنقاذ</button><button class="secondary" onclick="home()">الرئيسية</button></div>'}
function startRescue(){const name=document.getElementById('rescuer').value.trim();if(!name){alert('أدخل اسم المنقذ أولًا');return}rescue={name,gender:document.getElementById('rg').value,difficulty:+document.getElementById('rd').value,level:+document.getElementById('rl').value,pos:0,goal:6+2*(+document.getElementById('rl').value),answered:0,correct:0,wrong:0,question:null,options:[],chosen:null};storeGames();nextRescue()}
function nextRescue(){const r=rescue;if(!r)return;if(r.pos>=r.goal){rescueWin();return}let d=r.difficulty??0,a=d===0?1+rand(5):d===1?6+rand(5):1+rand(10),b=1+rand(10),ans=a*b,opts=new Set([ans]);while(opts.size<4){let v=Math.max(0,ans+rand(21)-10);opts.add(v)}r.question={a,b,ans};r.options=shuffle([...opts]);r.chosen=null;storeGames();drawRescue()}
function drawRescue(){const r=rescue;if(!r)return;storeGames();if(r.pos>=r.goal)return rescueWin();const progress=Math.min(1,Math.max(0,r.pos)/r.goal),walk=Math.min(1,progress),paths=[[[15,84],[25,78],[36,69],[46,60],[55,49],[65,38],[79,26]],[[22,84],[28,77],[37,69],[45,59],[54,50],[66,40],[77,26]],[[16,83],[26,76],[36,69],[46,61],[55,52],[66,40],[77,27]]],points=paths[(r.level??0)%3],segment=Math.min(points.length-2,Math.floor(walk*(points.length-1))),fraction=Math.min(1,walk*(points.length-1)-segment),heroX=(points[segment][0]+(points[segment+1][0]-points[segment][0])*fraction).toFixed(1)+'%',heroY=(points[segment][1]+(points[segment+1][1]-points[segment][1])*fraction).toFixed(1)+'%',heroScale=(1-.55*walk).toFixed(2),hero=r.gender==='girl'?'rescue_girl.png':'rescue_boy.png',stage=ar((r.level??0)+1),difficulty=['المستوى الأول','المستوى الثاني','المستوى الثالث'][r.difficulty??0]||'رحلة الإنقاذ';app.innerHTML='<div class="card stack"><h2 class="rescue-stage-title">🌲 رحلة الإنقاذ — المرحلة '+stage+'</h2><div class="notice">المنقذ'+(r.gender==='girl'?'ة':'')+': '+esc(r.name)+' • '+difficulty+'<div>المحاولة: '+ar((r.answered??(r.correct+r.wrong))+1)+' • خطوات مطلوبة: '+ar(r.goal)+' • صحيحة: '+ar(r.correct)+' • خاطئة: '+ar(r.wrong)+'</div></div><div class="rescue-scene" style="background-image:url('+(['a_highly_detailed_vibrant_realistic_illustrative.png','a_vibrant_highly_detailed_nature_scene_identical.png','a_vibrant_highly_detailed_realistic_illustrative.png'][(r.level??0)%3])+')" role="img" aria-label="رحلة عبر الغابة نحو الأسرة"><img class="rescue-hero" src="./'+hero+'" style="--hero-x:'+heroX+';--hero-y:'+heroY+';--hero-scale:'+heroScale+'" alt="المستكشف المتجه إلى أسرته"></div><div class="rescue-progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+r.goal+'" aria-valuenow="'+r.pos+'"><span style="width:'+(progress*100)+'%"></span></div><div class="muted" style="text-align:center">خطوات الإنقاذ: '+ar(r.pos)+' من '+ar(r.goal)+'</div><div class="rescue-que function rescueAnswer(i){const r=rescue;if(!r||r.chosen!==null||r.pos>=r.goal)return;r.chosen=r.options[i];r.answered=(r.answered??(r.correct+r.wrong))+1;if(r.chosen===r.question.ans){r.correct++;r.pos++}else{r.wrong++;r.pos=Math.max(0,r.pos-1)}storeGames();drawRescue()}
function certMarkup(r){return '<div class="cert" id="certificate"><div style="font-size:40px">🌟 🏅 🌟</div><h2>شهادة شكر وتقدير</h2><p>يتقدم الطفل ووالداه بخالص الشكر والامتنان إلى '+(r.gender==='girl'?'المنقذة المتميزة':'المنقذ المتميز')+'</p><strong>'+esc(r.name)+'</strong><p>لشجاعته ومساعدته الطفل الضائع في الغابة حتى عاد سالمًا إلى والديه.</p><p>بكل الحب والتقدير ❤️</p><div style="display:flex;justify-content:space-around;gap:10px"><span>توقيع الطفل<br>🧒</span><span>توقيع الوالدين<br>👨‍👩‍👦</span></div><small>تحدي جداول الضرب — رحلة الإنقاذ</small></div>'}
function rescueWin(){const r=rescue;const completed=r.pos===r.goal;app.innerHTML='<div class="card stack"><h2>'+(completed?'🎉 تم الإنقاذ بنجاح!':'🌲 اكتملت أسئلة المرحلة')+'</h2><div class="notice">'+(completed?'وصل الطفل إلى والديه. شكرًا لك يا ':'أجبت عن جميع أسئلة المرحلة يا ')+esc(r.name)+'! • الإجابات الصحيحة: '+ar(r.correct)+' من '+ar(r.goal)+'</div>'+(completed?certMarkup(r):'<div class="notice">أعد المحاولة لتحقق جميع خطوات الإنقاذ وتحصل على الشهادة.</div>')+(completed?'<button onclick="saveCertificate()">حفظ شهادة الشكر (SVG)</button>':'')+(completed&&r.level<9?'<button onclick="nextRescueStage()">المرحلة التالية</button>':'')+'<button onclick="rescueSetup()" class="secondary">رحلة جديدة</button><button onclick="home()" class="secondary">الرئيسية</button></div>'}
